# Publica o site no GitHub Pages sempre que algo muda na branch "main"
# (inclusive quando alguém publica pelo painel). Não precisa mexer aqui.
name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Descobre em que endereço o site vai ficar:
      # - repositório "usuario.github.io" (com o mesmo nome da conta): raiz do endereço, "/"
      # - qualquer outro nome: subpasta com o nome do repositório, "/nome-do-repo/"
      # Com domínio próprio, troque a linha do PATH_PREFIX por: PATH_PREFIX="/"
      - name: Gerar o site
        run: |
          REPO="${{ github.event.repository.name }}"
          DONO="${{ github.repository_owner }}"
          if [ "$(echo "$REPO" | tr A-Z a-z)" = "$(echo "$DONO" | tr A-Z a-z).github.io" ]; then
            PATH_PREFIX="/"
          else
            PATH_PREFIX="/$REPO/"
          fi
          echo "Publicando em: $PATH_PREFIX"
          PATH_PREFIX="$PATH_PREFIX" npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
